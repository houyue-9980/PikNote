# Xcode 项目的“配方”。改完运行 `xcodegen` 重新生成 PikNote.xcodeproj
name: PikNote
options:
  bundleIdPrefix: io.github.houyue9980
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 默认所有代码都在主线程跑，新手最省心
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "2.0.1"
    CURRENT_PROJECT_VERSION: "7"
targets:
  PikNote:
    type: application
    platform: macOS
    sources:
      - path: PikNote
        excludes: ["Resources/editor"]
      # 网页编辑器整个文件夹原样拷进 App
      - path: PikNote/Resources/editor
        type: folder
        buildPhase: resources
    info:
      path: PikNote/Info.plist
      properties:
        CFBundleName: 拾记
        CFBundleDisplayName: 拾记
        # 支持的界面语言（系统自带的菜单项会跟着设置里选的语言）
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: © 2026 Yue(Clyde) Hou · MIT License
    settings:
      base:
        PRODUCT_NAME: PikNote
        PRODUCT_BUNDLE_IDENTIFIER: io.github.houyue9980.piknote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 第一版不做签名公证，本机用临时签名运行
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        # 开发版用另一个身份：设置（笔记文件夹、颜色…）和正式版分开存，开发测试不会影响正式版
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.houyue9980.piknote.dev
